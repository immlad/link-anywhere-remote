<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>LinkDesk</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", -apple-system, system-ui, sans-serif; margin: 0;
    padding: 28px; background: #f6f7f9; color: #111827; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 999px; font-size: 12px; background: #e5e7eb; color: #4b5563; }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; }
  .status.live { background: #dcfce7; color: #166534; }
  .status.live::before { background: #22c55e; }
  #peers { font-size: 12px; color: #6b7280; margin-left: 6px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; margin-bottom: 14px; }
  .label { font-size: 12px; font-weight: 600; color: #374151; margin-bottom: 8px; }
  .hint { color: #6b7280; font-size: 12px; margin: 8px 0 0; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text] { flex: 1; background: #fff; border: 1px solid #d1d5db; color: #111827;
    padding: 9px 11px; border-radius: 8px; font-size: 14px; outline: none; width: 100%; }
  input[type=text]:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }
  input[readonly] { background: #f9fafb; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  button { background: #111827; color: #fff; border: 0; border-radius: 8px;
    padding: 9px 14px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  button:hover { background: #374151; }
  .code { display: none; }
  #copied { color: #16a34a; font-size: 12px; }
  details { font-size: 12px; color: #6b7280; }
  summary { cursor: pointer; }
  #log { font-family: ui-monospace, Consolas, monospace; font-size: 11px; max-height: 120px; overflow: auto; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <h1>LinkDesk</h1>
    <div><span id="status" class="status">Starting…</span><span id="peers"></span></div>
  </header>

  <div class="card">
    <div class="label">Your code</div>
    <div class="row">
      <input id="codeInput" type="text" placeholder="e.g. minh-office-pc" />
      <button id="saveCode">Save</button>
    </div>
    <div class="code" id="code"></div>
    <p class="hint">Letters, numbers and hyphens. Type this code on the website from any device.</p>
  </div>

  <div class="card">
    <div class="label">Link</div>
    <div class="row">
      <input id="viewerUrl" type="text" readonly />
      <button id="copy">Copy</button>
    </div>
    <p class="hint">Or open this link directly. <span id="copied"></span></p>
  </div>

  <details>
    <summary>Activity</summary>
    <div id="log"></div>
  </details>

<script src="./peerjs.min.js"></script>
<script>
const VIEWER_BASE = "https://id-preview--3d93dc29-7e73-4922-8726-5d4089f7f253.lovable.app/viewer";

const $ = (id) => document.getElementById(id);
const log = (m) => { const l = $("log"); l.innerHTML += `<div>${new Date().toLocaleTimeString()} — ${m}</div>`; l.scrollTop = l.scrollHeight; };

const CODE_KEY = "linkdesk-custom-code";

function sanitizeCode(s) {
  return (s || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 32);
}

function getSavedCode() {
  return localStorage.getItem(CODE_KEY) || "";
}

let peer = null;
let currentStream = null;
const peersSet = new Set();

function connectPeer(code) {
  if (peer) { try { peer.destroy(); } catch (_) {} }
  peersSet.clear();
  $("peers").textContent = "";

  const id = "linkdesk-" + code;
  peer = new Peer(id);
  $("status").textContent = "Connecting…";
  $("status").classList.remove("live");

  peer.on("open", (openId) => {
    $("status").textContent = "Online";
    $("status").classList.add("live");
    $("code").textContent = code;
    $("viewerUrl").value = `${VIEWER_BASE}#${code}`;
    log("Online with code: " + code);
  });

  peer.on("connection", (conn) => {
    peersSet.add(conn.peer);
    $("peers").textContent = `${peersSet.size} viewer(s)`;
    log("Viewer connected: " + conn.peer);

    conn.on("data", (ev) => {
      if (ev && ev.type === "request-stream") {
        const call = peer.call(conn.peer, currentStream);
        call.on("close", () => log("Call ended: " + conn.peer));
      } else if (ev && typeof ev === "object" && ev.type) {
        window.linkdesk.inputEvent(ev);
      }
    });
    conn.on("close", () => {
      peersSet.delete(conn.peer);
      $("peers").textContent = peersSet.size ? `${peersSet.size} viewer(s)` : "";
      log("Viewer left: " + conn.peer);
    });
  });

  peer.on("error", (e) => {
    if (e.type === "unavailable-id") {
      log(`Code "${code}" is already in use by someone else — pick another.`);
      $("status").textContent = "Code taken — choose another";
      $("status").classList.remove("live");
      localStorage.removeItem(CODE_KEY);
      $("codeInput").focus();
    } else {
      log("Error: " + e.message);
      $("status").textContent = "Error — retrying…";
      $("status").classList.remove("live");
      setTimeout(() => connectPeer(code), 5000);
    }
  });
}

async function start() {
  const info = await window.linkdesk.getScreenSource();
  log("Screen: " + info.width + "x" + info.height);

  // Capture the desktop as a MediaStream via Electron's desktopCapturer id.
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: {
      mandatory: {
        chromeMediaSource: "desktop",
        chromeMediaSourceId: info.id,
        minWidth: 1280, maxWidth: 1920,
        minHeight: 720, maxHeight: 1080,
        maxFrameRate: 30,
      },
    },
  });
  log("Screen capture started");
  currentStream = stream;

  const saved = getSavedCode();
  if (saved) {
    $("codeInput").value = saved;
    connectPeer(saved);
  } else {
    $("status").textContent = "Choose a code below to go online";
    $("codeInput").focus();
  }
}

$("saveCode").addEventListener("click", () => {
  const code = sanitizeCode($("codeInput").value);
  if (!code) {
    log("Please enter a code first (letters, numbers, hyphens).");
    return;
  }
  $("codeInput").value = code;
  localStorage.setItem(CODE_KEY, code);
  log("Code saved: " + code);
  connectPeer(code);
});

$("codeInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("saveCode").click();
});

$("copy").addEventListener("click", async () => {
  await navigator.clipboard.writeText($("viewerUrl").value);
  $("copied").textContent = "Copied!";
  setTimeout(() => ($("copied").textContent = ""), 1500);
});

start().catch((e) => {
  log("Fatal: " + (e.message || e));
  $("status").textContent = "Failed to start";
});
</script>
</body>
</html>
